[mypy]
python_version = 3.12
strict = True

# Every run starts from nothing, so a cache written by an earlier trial
# cannot shorten or change a later one.
incremental = False
cache_dir = /dev/null

# A third-party package without type stubs is not a design defect, and the
# arms are free to choose different dependencies. Counting "library stubs not
# installed" would score the trial's dependency list rather than its types.
ignore_missing_imports = True
follow_imports = silent

# Errors are counted, so each one must be a line the report can attribute.
show_error_codes = True
pretty = False
color_output = False
