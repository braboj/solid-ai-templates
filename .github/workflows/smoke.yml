name: Smoke tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # The conformance runner reads the tag history to reconcile a
      # release against its changelog, so a shallow clone fails it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run smoke tests
        run: python tests/run_smoke.py
      - name: Run the templates' own checks against this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/run_conformance.py
      - name: Check generated docs are up to date
        run: python tools/sync.py --check
      - name: Check generated/ files are up to date
        run: python tools/resolve.py --check
      - name: Check for new redundant rules
        run: python tools/audit_redundancy.py --check
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Secret detection (gitleaks)
        run: gitleaks detect --source . --verbose